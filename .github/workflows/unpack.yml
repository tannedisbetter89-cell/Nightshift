name: Unpack Nightshift

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for source archive
        run: |
          if [ ! -f grok-workspace-ready.zip ]; then
            echo "No source archive found. Nothing to unpack."
            exit 0
          fi

      - name: Unpack clean project
        run: |
          cp grok-workspace-ready.zip /tmp/nightshift.zip

          rm -rf /tmp/nightshift
          mkdir -p /tmp/nightshift

          unzip -o /tmp/nightshift.zip -d /tmp/nightshift

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a /tmp/nightshift/. .

          rm -rf .vercel/output
          rm -f grok-workspace-ready.zip

      - name: Commit proper project structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore clean Nightshift project structure"
            git push
          fi
