name: Unpack Nightshift

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf /tmp/nightshift
          mkdir -p /tmp/nightshift
          unzip -o grok-workspace-ready.zip -d /tmp/nightshift
          cp -a /tmp/nightshift/. .
          rm -rf .vercel/output

      - name: Commit proper project structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore Nightshift project structure"
            git push
          fi
